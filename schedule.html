<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phase B でリポジトリ書き込み権限を持つトークンをブラウザに保存するため、
         スクリプトの実行元を自分自身だけに絞る。'unsafe-inline' を入れないので
         インライン script と javascript: URL は実行されない。
         style は Leaflet と自前コードが style 属性を多用するため許可が要る
         （狙いはスクリプト実行の遮断であって、スタイルではない）。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self' data: https:;
               connect-src 'self' https://api.github.com;
               base-uri 'self';
               form-action 'none'"
    />
    <title>旅程 — Thailand 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,300;6..72,400&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/controls.css" />
    <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="assets/css/calendar.css" />
  </head>
  <body>
    <nav class="nav" id="nav"></nav>

    <!-- 起動時の案内バー（別端末が先に公開していた／最新を確認できなかった）。
         中身は publish-ui.js が入れる。空のまま出すと隙間だけが残るので
         hidden で始める（CSS 側で display:flex を [hidden] より弱くしてある）。 -->
    <div class="syncbar" id="syncbar" role="region" aria-label="同期の状態" hidden></div>

    <main class="wrap sec">
      <div class="pagehead reveal">
        <p class="eyebrow">Itinerary</p>
        <h1 class="display lines"><span class="ln"><i>六日間の道のり</i></span></h1>
      </div>

      <div class="toolbar reveal">
        <div class="toolbar__group">
          <span class="eyebrow">Hours</span>
          <select id="view-start" aria-label="表示開始時刻"></select>
          <span class="micro">—</span>
          <select id="view-end" aria-label="表示終了時刻"></select>
        </div>
        <div class="toolbar__group" id="cat-filters">
          <span class="eyebrow">Category</span>
        </div>
        <!-- 中身（アイコンとラベル）は schedule.js が入れる。
             旅程を読み終えるまでは押せない（押しても開けるフォームが無い）。 -->
        <div class="toolbar__group toolbar__group--end">
          <button class="tbtn" id="ev-edit-toggle" aria-pressed="false" disabled></button>
          <button class="tbtn" id="ev-add" disabled></button>
          <!-- 公開ボタンとトークン設定の置き場。トークンが無いときに
               公開ボタンを置かないので、中身は publish-ui.js が入れる。 -->
          <span class="toolbar__group" id="pub-controls"></span>
        </div>
      </div>

      <!-- トークン設定（開閉）と、公開・取り込みの結果。
           結果は押した直後に出るが、割り込みたいほどではないので polite。 -->
      <div class="pub">
        <div class="pubpanel" id="pub-panel" hidden></div>
        <div class="pubstat" id="pub-status" role="status" aria-live="polite" hidden></div>
      </div>

      <div class="cal" id="cal"></div>

      <div class="mapsec reveal">
        <div id="leaflet-map"></div>
        <div class="loclist" id="loclist"></div>
      </div>
    </main>

    <div class="sheet-overlay" id="sheet-overlay"></div>
    <!-- 閉じているあいだ inert になる（sheet.js）。inert は支援技術からも
         隠すため、aria-hidden をここに書いて付け外しする必要はない。
         アイコンは他と揃えて icon() が入れる（中身は空で始める）。 -->
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true"
           aria-labelledby="sheet-title">
      <div class="sheet__head">
        <p class="eyebrow" id="sheet-title">予定</p>
        <button class="rowbtn" id="sheet-close" aria-label="閉じる"></button>
      </div>
      <div class="sheet__body" id="sheet-body"></div>
      <div class="sheet__foot" id="sheet-foot"></div>
    </aside>

    <!-- Leaflet はクラシックスクリプト。map.js がグローバルの L を使うため、
         module スクリプトより前に置く必要がある -->
    <script src="assets/vendor/leaflet/leaflet.js"></script>
    <script type="module" src="assets/js/schedule.js"></script>
  </body>
</html>
