<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phase B でリポジトリ書き込み権限を持つトークンをブラウザに保存するため、
         スクリプトの実行元を自分自身だけに絞る。'unsafe-inline' を入れないので
         インライン script と javascript: URL は実行されない。
         style は Leaflet と自前コードが style 属性を多用するため許可が要る
         （狙いはスクリプト実行の遮断であって、スタイルではない）。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self' data: https:;
               connect-src 'self' https://api.github.com;
               base-uri 'self';
               form-action 'none'"
    />
    <title>Thailand 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,300;6..72,400&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/controls.css" />
  </head>
  <body>
    <nav class="nav" id="nav"></nav>

    <main class="wrap sec">
      <div class="menu__head reveal">
        <div>
          <p class="eyebrow">12–17 August 2026</p>
          <h1 class="display lines" style="margin-top: var(--s2)">
            <span class="ln"><i>Thailand</i></span>
          </h1>
        </div>
        <p class="micro" id="countdown"></p>
      </div>

      <form class="pubpanel reveal" id="auth-form" hidden>
        <label class="inp__label" for="auth-pass">合言葉</label>
        <input class="inp" type="password" id="auth-pass" autocomplete="current-password" />
        <p class="micro" id="auth-status" role="status"></p>
        <button class="btn" type="submit" id="auth-submit">開く</button>
      </form>

      <div class="menu__grid" id="menu"></div>
    </main>

    <script type="module" src="assets/js/menu.js"></script>
  </body>
</html>
