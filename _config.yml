# GitHub Pages は既定でリポジトリ全体を Jekyll に通す。このサイトは素の静的ファイルで
# Jekyll の機能を 1 つも使っていないので、通して得るものが無い一方で失うものがある。
#
# 2026-08-10、実装計画に書いた JSDoc の型注記（波括弧 2 つで始まる形）を Liquid の
# 変数の開始と解釈して構文エラーになり、**サイト全体のデプロイが 3 回続けて失敗した**。
# 本番は前の版で止まり、その間 Phase B2 の持ち物ページは公開されなかった。
# ドキュメントの 1 行がページの公開を止められる、という結合そのものが問題。
#
# **いま実際にビルドを止めているのは、このファイルではなく .nojekyll のほう。**
# 2026-08-10 に本番で確認した: /_config.yml も /tests/time.test.js も 200 を返す。
# Jekyll が走っていればどちらも 404 になるので、Jekyll は走っていない ──
# つまり下の exclude は現時点では 1 つも仕事をしていない。
# （かつて「.nojekyll を置いてもビルドが走って落ちた」と記録したが、いまは効いている。）
#
# **それでも exclude は消さないこと。** これは .nojekyll が効かなくなった日のための
# 二重の防御で、そのとき Jekyll に読ませてはいけないものの一覧がここにある。
# exclude に挙げたものは Jekyll が読みもしないので、中に何を書いても安全になる。
# サイト本体（*.html / assets/）はここに挙げていないため、これまでどおり配信される
# ── front matter を持たない .html は Jekyll がそのまま複製する。
# ドキュメントは docs/ に集約してあるので、新しく足すぶんは `docs/` の 1 行で覆える
# （旧 DESIGN.md も docs/design/design-system.md へ移した）。
# ルートに残る CLAUDE.md / README.md / package.json だけは個別に挙げる必要がある。
#
# **exclude は配信を止めない。** Jekyll に読ませないだけで、いまはリポジトリ全体が
# 素のまま配信されている。何が公開されるかは README「デプロイメント」に一本化してある。
exclude:
  - docs/
  - tests/
  - CLAUDE.md
  - README.md
  - package.json
