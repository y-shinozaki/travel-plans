# GitHub Pages は既定でリポジトリ全体を Jekyll に通す。このサイトは素の静的ファイルで
# Jekyll の機能を 1 つも使っていないので、通して得るものが無い一方で失うものがある。
#
# 2026-08-10、実装計画に書いた JSDoc の型注記（波括弧 2 つで始まる形）を Liquid の
# 変数の開始と解釈して構文エラーになり、**サイト全体のデプロイが 3 回続けて失敗した**。
# 本番は前の版で止まり、その間 Phase B2 の持ち物ページは公開されなかった。
# ドキュメントの 1 行がページの公開を止められる、という結合そのものが問題。
#
# リポジトリ直下に .nojekyll も置いてあるが、この Pages の構成では効かなかった
# （置いた状態でビルドが走り、同じ Liquid エラーで落ちた）。そのため exclude で
# 明示的に外している。**この 2 つはどちらも消さないこと。**
#
# exclude に挙げたものは Jekyll が読みもしないので、中に何を書いても安全になる。
# サイト本体（*.html / assets/）はここに挙げていないため、これまでどおり配信される
# ── front matter を持たない .html は Jekyll がそのまま複製する。
# ドキュメントは docs/ に集約してあるので、1 行で全部が外れる
# （旧 DESIGN.md も docs/design/design-system.md へ移した）。
exclude:
  - docs/
  - tests/
  - CLAUDE.md
  - README.md
  - package.json
